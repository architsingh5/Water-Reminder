name: Release

# Builds, tests and signs the APK with the release key from repository
# secrets, then publishes a GitHub release tagged v<versionName>.
# Run it from the Actions tab (or the API) after bumping versionCode /
# versionName in app/build.gradle.kts and adding
# .github/release-notes/v<versionName>.md.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate. Every release must match it,
  # otherwise the APK can't update the installed app.
  RELEASE_CERT_SHA256: c4492940dc5da2ec4e48d17931cbdd1ae37dfc36fc4a0d313d6d3eef2c6f93b1
  BUILD_TOOLS: "36.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version and check release notes
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          test -n "$name" || { echo "::error::versionName not found"; exit 1; }
          tag="v$name"
          notes=".github/release-notes/$tag.md"
          test -f "$notes" || { echo "::error::Missing $notes"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; bump versionName first"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build, test and lint
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest lint

      - name: Verify APK signature and version
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::APK is not signed with the release key"; exit 1; }
          "$bt/aapt2" dump badging "$apk" | grep -q "versionName='${{ steps.version.outputs.name }}'" \
            || { echo "::error::APK versionName mismatch"; exit 1; }
          out="$RUNNER_TEMP/WaterReminder-${{ steps.version.outputs.tag }}.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "Water Reminder ${{ steps.version.outputs.name }}" \
            --notes-file "${{ steps.version.outputs.notes }}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
